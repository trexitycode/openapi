description: |
  A registered webhook. Custom header data is not included when webhooks are
  listed; retrieve it from `GET /webhooks/{webhookId}/headers`.
type: object
properties:
  id:
    type: string
  createdAt:
    type: string
    format: date-time
  merchantId:
    type: string
  type:
    type: string
    enum: [merchant-webhook]
  eventName:
    $ref: ./WebhookEventName.yaml
  url:
    type: string
    format: uri
