type: object
maxProperties: 10
additionalProperties:
  type: string
  maxLength: 1024
description: |
  Custom HTTP header names mapped to their string values. A webhook may have no
  more than 10 custom headers.

  `Authorization` is treated as sensitive: its value is encrypted at rest and
  masked when read. Sensitive and reserved-name comparisons are
  case-insensitive.

  Header names are case-sensitive identities: `X-Api-Key` and `x-api-key` are
  two distinct headers, each consuming one of the 10 slots. Only the sensitive
  and reserved-name checks are case-insensitive. Updating or deleting a header
  must therefore use the exact stored casing.

  Header names are limited to 128 characters and must be a valid HTTP token
  (RFC 7230). Header values are limited to 1024 characters and may not contain
  carriage returns or line feeds.

  The following names are reserved and rejected:
  `content-type`, `content-length`, `host`, `connection`,
  `transfer-encoding`, `te`, `trailer`, `upgrade`, `expect`, and `keep-alive`.
  Names beginning with `x-trexity-`, `proxy-`, or `webhook-` are also rejected.
