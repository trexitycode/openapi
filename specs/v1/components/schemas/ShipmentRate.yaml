type: object
description: |
  **(ADDED IN v1.27)** The rate of a Shipment.
properties:
  name:
    type: string
    description: |
      **(ADDED IN v1.31)** The name of the rate to show to the customer (if applicable)
  description:
    type: string
    description: |
      **(ADDED IN v1.31)** The description of the rate to show to the customer (if applicable).

      **(ADDED IN v1.39)** Same Day Standard uses window language (between 5 PM and 8 PM). Next Day Express uses deadline language (by 5 PM).
  serviceType:
    type: string
    description: |
      **(ADDED IN v1.31)** The shipment service type associated to the shipment rate.

      **(ADDED IN v1.39)** Common values include `samedaystandard`, `nextday`, `nextdayexpress`, `direct`, and `default` (classic Same Day). Hub types appear only when they are available in the pickup market. Classic Same Day (`default`) is being retired on **January 4, 2027**.
    example: samedaystandard
  currency:
    type: string
    description: |
      **(ADDED IN v1.32)** The currency of the rate. Before v1.32 the currency was always the local currency
      of the pickup address. This field makes it explicitly clear the currency of the rate.
    enum:
      - CAD
      - USD
  total:
    type: number
    description: The total fee in cents for delivery with taxes.
  deliveryWithoutTaxes:
    type: number
    description: The total fee in cents for the delivery portion of the rate.
  fuelWithoutTaxes:
    type: number
    description: The total fee in cents for fuel cost portion of the rate.
  surchargesWithoutTaxes:
    type: array
    description: The breakdown of each surcharge before taxes added to the rate
    items:
      type: object
      properties:
        type:
          type: string
          enum: [oversized, distance, large-vehicle]
          description: |
            The surcharge type.

            - `oversized` applied for a surplus of labels
            - `distance` applied for long distance deliveries
            - `large-vehicle` applied for shipments that require a medium or large vehicle
        amount:
          type: number
          description: The amount in cents of the surcharge
  totalWithoutTaxes:
    type: number
    description: |
      The total fee in cents for entire delivery without taxes.

      Equates to the sum of
      - `deliveryWithoutTaxes`
      - `fuelWithoutTaxes`
      - total `amount` from `surchargesWithoutTaxes`
  taxRates:
    type: object
    description: An object whos keys are tax rate codes and value is the tax rate.
    additionalProperties: { type: number, minimum: 0, maximum: 1, exclusiveMinimum: true, exclusiveMaximum: true }
  taxAmounts:
    type: object
    description: An object whos keys are tax rate codes and value is the tax amount charged in cents.
    additionalProperties: { type: number, minimum: 0, maximum: 1, exclusiveMinimum: true, exclusiveMaximum: true }
  totalTaxes:
    type: number
    description: The total taxes charged in cents.
