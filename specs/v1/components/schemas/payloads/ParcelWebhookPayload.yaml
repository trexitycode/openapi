description: |
  Webhook payload during a parcel event. Trexity sends complete entity data in
  `data`, not a thin payload.
type: object
additionalProperties: false
required: [data, timestamp, type]
properties:
  type:
    description: |
      Event name. This is the same value sent in the deprecated
      `x-trexity-event-name` header.
    allOf:
      - $ref: ../WebhookEventName.yaml
  timestamp:
    description: |
      ISO-8601 date-time when the event occurred, with millisecond resolution.
      This value remains stable across delivery retries and should be used for
      event ordering instead of the deprecated `x-trexity-webhook-order-id`
      header. Two events occurring in the same millisecond have the same
      timestamp and are unordered relative to each other.

      ISO date strings are in UTC. Example: `2020-07-25T10:48:08.987Z`.
    type: string
    format: date-time
  data:
    type: object
    required: [shipmentId, deliveryIndex, orderUuid, parcel]
    properties:
      shipmentId:
        type: string
        description: |
          The ID of the shipment containing the parcel affected.

          **(CHANGED IN v1.39)** For classic Direct RTS, return events
          (`parcel.returning` / `parcel.returned` and later courier parcel events)
          use the newly created return shipment id. In hub-fulfillment markets those
          same events use the original inbound shipment id, not the physical return id.
      deliveryIndex:
        type: integer
        description: The index of the parcel affected within the shipment.
      orderUuid:
        type: string
        description: The Trexity generated unique identifier for the parcel/order.
      parcel:
        $ref: ../Parcel.yaml
