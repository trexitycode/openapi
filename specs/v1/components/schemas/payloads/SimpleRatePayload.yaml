description: A minimal object that describes a direct shipment
allOf:
  - $ref: '../DeliveryWindowProps.yaml'
  - type: object
    required:
      - deliveryAddress
    properties:
      pickupAddress:
        $ref: ../Address.yaml
      numLabels:
        type: number
        minimum: 1
        default: 1
        description: |
          **(added in 1.12)** The number of labels for the parcel (each separate package needs a label).
      deliveryAddress:
        type: string
        description: An address
        items:
          $ref: ../Address.yaml
      requirements:
        $ref: ../ShipmentRequirements.yaml
      orderValue:
        type: number
        minimum: 0
        description: The order value, if any. Specified in cents.
      requiresPersonHandoff:
        type: boolean
        description: |
          **(ADDED IN v1.40)** Whether the delivery requires PIN verification on handoff. When omitted, defaults to the pickup merchant location’s `defaultRequiresPersonHandoff` setting.
      requiresSignature:
        type: boolean
        description: |
          **(ADDED IN v1.40)** Whether the delivery requires a recipient signature. When omitted, defaults to the pickup merchant location’s `defaultRequiresSignature` setting.
      containsAlcohol:
        type: boolean
        description: |
          **(ADDED IN v1.40)** Whether the parcel contains alcohol and requires legal age verification (which also requires PIN verification on handoff). When omitted, defaults to the pickup merchant location’s `defaultContainsAlcohol` setting.
