description: |
  Webhook payload during a shipment event. Trexity sends the complete Shipment
  entity in `data`, not a thin payload.
type: object
additionalProperties: false
required: [data, timestamp, type]
properties:
  type:
    description: |
      Event name. This is the same value sent in the deprecated
      `x-trexity-event-name` header.
    allOf:
      - $ref: ../WebhookEventName.yaml
  timestamp:
    description: |
      ISO-8601 date-time when the event occurred, with millisecond resolution.
      This value remains stable across delivery retries and should be used for
      event ordering instead of the deprecated `x-trexity-webhook-order-id`
      header. Two events occurring in the same millisecond have the same
      timestamp and are unordered relative to each other.

      ISO date strings are in UTC. Example: `2020-07-25T10:48:08.987Z`.
    type: string
    format: date-time
  data:
    $ref: ../Shipment.yaml