description: Webhook signing secrets for a merchant.
type: object
required: [secretKey, standardWebhooksSecretKey]
properties:
  secretKey:
    type: string
    description: |
      Legacy secret used only to verify the deprecated `x-trexity-signature`
      header.
  standardWebhooksSecretKey:
    type: string
    description: |
      Standard Webhooks signing secret in `whsec_<base64>` format. Always pass
      this value to Standard Webhooks libraries.

      **WARNING:** Never pass the legacy `secretKey` to a Standard Webhooks
      library. The legacy value is itself valid base64, so the library silently
      derives a different key and every signature verification fails.
    pattern: ^whsec_[A-Za-z0-9+/]+={0,2}$
