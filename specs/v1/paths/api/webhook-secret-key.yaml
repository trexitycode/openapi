get:
  operationId: getWebhookSecretKey
  tags: [Webhooks]
  summary: Get webhook signing secrets
  description: |
    Gets the merchant's legacy and Standard Webhooks signing secrets.

    **Always use `standardWebhooksSecretKey` with a Standard Webhooks library.**
    Passing the legacy `secretKey` to one of these libraries silently derives a
    different key and causes every verification to fail.
  responses:
    '200':
      description: Webhook signing secrets.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: ../../components/schemas/WebhookSecretKeys.yaml
    '401':
      description: Missing or invalid authentication.
    '500':
      description: An internal error has occurred and the request cannot be completed.
