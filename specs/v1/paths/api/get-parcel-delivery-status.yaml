get:
  operationId: getParcelDeliveryStatus
  tags: [Parcels]
  summary: Get Parcel Delivery Status
  description: |
    **(ADDED IN v1.26)** Retrieve a parcel's delivery status
  x-codeSamples:
    - $ref: ../../code_samples/Shell/parcels/get-parcel-delivery-status.yaml

  ##############################################################################

  parameters:
    - in: path
      name: parcelId
      required: true
      schema:
        type: string
      description: The id of the parcel (can be externalId or parcel ID)
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  status:
                    description: |
                      The current delivery status of the parcel.

                      - `pending`: The parcel is awaiting pickup or delivery.
                      - `pre-transit`: The courier is heading out for pickup. **(ADDED IN v1.33)**
                      - `in-transit`: The courier has picked up the parcel and is heading out for delivery.
                      - `delivered`: The parcel has been delivered.
                      - `undeliverable`: The delivery was attempted but failed and the parcel was returned to the sender.
                      - `cancelled`: The parcel was cancelled.
                    type: string
                    enum:
                      - pending
                      - pre-transit
                      - in-transit
                      - delivered
                      - undeliverable
                      - cancelled
                  eta:
                    type: string
                    format: date-time
                    nullable: true
                    description: |
                      **(ADDED IN v1.38)** The estimated date-time of the courier's arrival, or null when no ETA is available.

                      What the ETA refers to depends on the `status`:

                      - `pre-transit`: the estimated arrival of the courier at the pickup address.
                      - `in-transit`: the estimated arrival of the courier at the parcel's delivery address.

                      An ETA is only computed for the `pre-transit` and `in-transit` statuses. All other statuses will always be null.
                      Even for those statuses the ETA is null until it has been computed for the first time.

                      The ETA is recomputed periodically and reflects the estimate as of the last computation, so it may be a
                      date-time in the past when the courier is running behind the last computed estimate.
                    example: '2026-08-04T18:30:00.000Z'

    '404':
      description: Parcel not found
