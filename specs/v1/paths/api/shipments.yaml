post:
  operationId: createShipment
  tags: [Shipments]
  summary: Create a shipment
  description: |
    Create a new shipment.

    If no `pickupAddress` is specified then the merchant's business address will be used as the pickup address.

    Use `serviceTypeOrRateId` to select a product. Hub types (`samedaystandard`, `nextday`, `nextdayexpress`) are available only in enabled hub markets.

    **Creating a Same Day Standard shipment**

    **(ADDED IN v1.39)** Use `samedaystandard`. `pickupStartAt` is required and only the calendar day is used. The hub wave supplies pickup and delivery windows. After that day's cutoff the request is rejected with `hub-pickup-cutoff-passed`.

    **Creating a Next Day shipment**

    To create a Next Day shipment, use `nextday` as the value for the `serviceTypeOrRateId` field when creating the shipment.

    Schedule a Next Day shipment by optionally providing a value for the `pickupStartAt` field. If provided, only the calendar day is used. When no pickup time is provided then the next eligible day is chosen.

    **Creating a Next Day Express shipment**

    **(ADDED IN v1.39)** Use `nextdayexpress`. `pickupStartAt` is required and only the calendar day is used, the same way as Same Day Standard.

    **Creating a classic Same Day shipment**

    To create a classic Same Day shipment, use `default` as the value for the `serviceTypeOrRateId` field when creating the shipment. Classic Same Day is being retired on **27 September 2026**. Prefer an explicit hub type. `sameday` is not accepted.

    **Creating a Direct shipment**

    To create a Direct shipment, use `direct` as the value for the `serviceTypeOrRateId` field when creating the shipment.

    **Creating a Draft shipment**

    To create a Draft shipment, use `draft` as the value for the `serviceTypeOrRateId` field when creating the shipment.

    When `serviceTypeOrRateId` is `draft`, the shipment is created as a draft with no service level selected, no pricing calculated, and no eligibility checks performed. The shipment cannot be scheduled or posted until a real service type is selected.
  x-codeSamples:
    - $ref: ../../code_samples/Shell/shipments/create-shipment.yaml

  ##############################################################################

  parameters:
    - $ref: ../../components/headers/idempotency-key.yaml
  requestBody:
    description: Payload describing your shipment
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/payloads/CreateShipmentPayload.yaml
        examples:
          ImmediateInit:
            value:
              pickupAddress: '9 Slack Rd, Nepean ON K2G 0B7, CA'
              pickupInstructions: 'Please be careful, since it may contain fragile things!'
              requirements: {}
              parcels:
                - deliveryAddress: '207 Queen St, Ottawa ON K1P 6E5, CA'
                  deliveryName: 'Srinivasa Ramanujan'
                  description: 'Glasses, bifocals'
                  orderId: 'BFG10K'
                  parcelValue: 10000
          ScheduledInit:
            value:
              pickupAddress: '207 Queen St, Ottawa ON K1P 6E5, CA'
              pickupInstructions: 'Please be careful, since it may contain fragile things!'
              requirements: {}
              pickupStartAt: '2020-07-25T10:16:11.048Z'
              parcels:
                - deliveryAddress: '343 Booth St, Ottawa ON K1R 7K1, CA'
                  deliveryName: 'Lagrange'
                  description: 'Copy of Newtons Principia Mathematica'
                  orderId: 'NWTNRULZ'
                  parcelValue: 15000
  responses:
    '500':
      description: Unknown server problem
    '400':
      description: Invalid payload or permission denied.
      content:
        application/json:
            schema:
              type: object
              properties:
                error: { type: string, nullable: true }
                params: { type: object, nullable: true }
                code:
                  type: string
                  nullable: true
                  description: |
                    Unexhaustive list of codes.

                    - `unauthorized-requirements` = When the requirements specified don't match the requirements granted to the merchant
                    - `pickup-address-unserviceable` = When the pickup address cannot be matched to any of the merchant's locations
                    - `invalid-pickup-address` = When the pickup address is invalid
                    - `invalid-delivery-address` = When the delivery address is invalid
                    - `pickup-point-outside-zone` = When the pickup address is outside Trexity's service area
                    - `invalid-input` = When there are issues with the input data provided
                    - `invalid-shipment-data` = When there are issues with the input data provided and the shipment entity cannot be instantiated
                    - `num-labels-too-large` = When numLabels is too large
                    - `invalid-scanids` = When the scanId specified is already in use
                    - `outside-operating-hours` = When the pickup or delivery time specified is outside the your delivery hours or Trexity's service hours
                    - `invalid-scheduled-posting-date` = The scheduling fields are invalid and do not describe a valid pickup window
                    - `unauthorized-numlabels` = When total numLabels for the entire shipment is too large
                    - `pickup-address-outsidetaxboundary` = The pickup address is outside the merchant's location province
                    - `merchant-disabled` = The merchant has been disabled
                    - `missing-profile-details` = The merchant has an incomplete profile
                    - `no-shipment-rate` = A shipment rate failed to be calculated due to delivery or pickup address geofencing error
                    - **(ADDED IN v1.39)** `hub-pickup-cutoff-passed` = The cutoff for the requested hub service type and calendar day has passed. Choose a later day of the same type.
                    - **(ADDED IN v1.38)** `idempotency-key-invalid` = The Idempotency-Key header is empty, longer than 255 characters, or contains non-printable characters
    '409':
      description: |
        **(ADDED IN v1.38)** A request with the same Idempotency-Key is still
        being processed. Retry after a short backoff. The response code is
        `idempotency-key-in-progress`.
      content:
        application/json:
          schema:
            type: object
            required: [error, code, params]
            properties:
              error: { type: string }
              code:
                type: string
                enum: [idempotency-key-in-progress]
              params: { type: object, nullable: true }
    '422':
      description: |
        **(ADDED IN v1.38)** The Idempotency-Key was previously used for a
        different request. The response code is `idempotency-key-mismatch`.
      content:
        application/json:
          schema:
            type: object
            required: [error, code, params]
            properties:
              error: { type: string }
              code:
                type: string
                enum: [idempotency-key-mismatch]
              params: { type: object, nullable: true }
    '200':
      description: Success
      headers:
        Idempotency-Replayed:
          description: |
            **(ADDED IN v1.38)** Present with a value of `true` when this is a
            replay of a completed request.
          schema:
            type: boolean
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  shipmentId:
                    type: string
                  parcels:
                    type: array
                    description: |
                      **(ADDED IN v1.25)** The IDs of the parcels that were created as part of this shipment.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
          examples:
            Success:
              value:
                data:
                  shipmentId: 'TRX973036599-6KL'
                  parcels: [{ id: '123e4567-e89b-12d3-a456-426614174000' }]

get:
  operationId: getShipments
  tags: [Shipments]
  summary: List shipments
  description: |
    List shipments that match the specified filters.

    ## Filtering By Dates

    When filtering by a date range both the `fromDate` and `toDate` query parameters must be provided.

    ## Filtering By External ID

    When filtering by a parcel's external ID you **cannot filter by dates**. Filtering by dates and external ID are mutually exclusive filters. If `externalId` is specified it will take precendence.
    **(ADDED IN v1.2)**

    ## Filtering By Parcel Metadata
    **(DEPRECATED AS OF v1.2)**

    ~~Parcel metadata fields can be filtered on by using query parameters with the following pattern `meta_{fieldName}`.~~

    ~~Additionally, the metadata field must have been saved as a string, and not a number for example. This is required since
    the query parameter value is not converted to a number.~~

    ~~Example: `https://{server-url}/shipments?meta_partnerShipmentId=someid`~~
  x-codeSamples:
    - $ref: ../../code_samples/Shell/shipments/get-shipments.yaml

  ##############################################################################

  parameters:
    - in: query
      name: select
      schema:
        type: string
      description: |
        **(ADDED IN v1.22)** The comma-separated list of fields to include in the shipment response (if not specified or blank then all fields will be included).

        If a field is specified that is not defined by the Shipment object, then responds with HTTP 400. Only top-level fields are supported.
    - in: query
      name: fromDate
      schema:
        $ref: ../../components/schemas/SimplifiedDateISOString.yaml
    - in: query
      name: toDate
      schema:
        $ref: ../../components/schemas/SimplifiedDateISOString.yaml
    - in: query
      name: externalId
      schema:
        type: string
        maxLength: 256
        description: |
          **(ADDED IN v1.2)** The ID of the external entity that is associated to this parcel (e.g. the external order or shipment ID).
    - in: query
      name: merchantPpid
      deprecated: true
      description: |
        **(DEPRECATED AS OF v1.1)**
      schema:
        type: string
  responses:
    '400':
      description: Select contains a field not in a Shipment object, query params invalid, or permission denied.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: The error message
                example: Invalid data payload
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../../components/schemas/Shipment.yaml

