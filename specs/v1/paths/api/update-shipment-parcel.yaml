patch:
  operationId: updateShipmentParcel
  tags: [Shipments]
  summary: Update a parcel
  description: |
    Updates the details of a parcel.

    **(ADDED IN v1.1)**
    When updating metadata fields the fields will be merged into the parcel's existing
    metadata. Any metadata fields set to `null` or `undefined` will be deleted.
  x-codeSamples:
    - $ref: ../../code_samples/Shell/shipments/update-shipment-parcel.yaml

  ##############################################################################

  parameters:
    - in: path
      name: shipmentId
      required: true
      schema:
        type: string
      description: The id of the shipment that needs to be updated
    - in: path
      name: deliveryIndex
      required: true
      schema:
        type: integer
      description: The delivery index of the parcel to be updated
    - $ref: ../../components/headers/idempotency-key.yaml
  requestBody:
    description: Payload containing the parcel's data that needs to be updated
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/payloads/ParcelPayload.yaml
        example:
          deliveryAddress: '207 Queen St, Ottawa ON K1P 6E5, CA'
          deliveryName: John Doe
          description: Grocery order with 3 bags
          orderId: 3453FR-REF
  responses:
    '500':
      description: Unknown server problem
    '400':
      description: |
        Invalid payload or permission denied.

        **(ADDED IN v1.38)** A malformed Idempotency-Key returns
        `code: idempotency-key-invalid`.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, nullable: true }
              code:
                type: string
                nullable: true
                description: |
                  `idempotency-key-invalid` indicates the Idempotency-Key is
                  empty, longer than 255 characters, or contains non-printable
                  characters.
              params: { type: object, nullable: true }
    '409':
      description: |
        **(ADDED IN v1.38)** A request with the same Idempotency-Key is still
        being processed. Retry after a short backoff. The response code is
        `idempotency-key-in-progress`.
      content:
        application/json:
          schema:
            type: object
            required: [error, code, params]
            properties:
              error: { type: string }
              code:
                type: string
                enum: [idempotency-key-in-progress]
              params: { type: object, nullable: true }
    '422':
      description: |
        **(ADDED IN v1.38)** The Idempotency-Key was previously used for a
        different request. The response code is `idempotency-key-mismatch`.
      content:
        application/json:
          schema:
            type: object
            required: [error, code, params]
            properties:
              error: { type: string }
              code:
                type: string
                enum: [idempotency-key-mismatch]
              params: { type: object, nullable: true }
    '204':
      description: Success
      headers:
        Idempotency-Replayed:
          description: |
            **(ADDED IN v1.38)** Present with a value of `true` when this is a
            replay of a completed request.
          schema:
            type: boolean
