post:
  operationId: shipmentReadyForPickup
  tags: [Shipments]
  summary: Shipment ready for pickup
  description: |
    Marks a shipment as ready for pickup. A shipment marked as ready for pickup will be dispatched to the first available driver.

    Only shipments with the service type `direct` that are in the `draft` status can be marked as ready for pickup.
  x-codeSamples:
    - $ref: ../../code_samples/Shell/shipments/shipment-ready-for-pickup.yaml

  ##############################################################################

  parameters:
    - in: path
      name: shipmentId
      required: true
      schema:
        type: string
      description: The id of the shipment that needs to be marked as ready for pickup
    - $ref: ../../components/headers/idempotency-key.yaml
  responses:
    '204':
      description: Success
      headers:
        Idempotency-Replayed:
          description: |
            **(ADDED IN v1.38)** Present with a value of `true` when this is a
            replay of a completed request.
          schema:
            type: boolean
    '400':
      description: |
        **(ADDED IN v1.38)** The Idempotency-Key header is empty, longer than
        255 characters, or contains non-printable characters. The response code
        is `idempotency-key-invalid`.
      content:
        application/json:
          schema:
            type: object
            required: [error, code, params]
            properties:
              error: { type: string }
              code:
                type: string
                enum: [idempotency-key-invalid]
              params: { type: object, nullable: true }
    '409':
      description: |
        **(ADDED IN v1.38)** A request with the same Idempotency-Key is still
        being processed. Retry after a short backoff. The response code is
        `idempotency-key-in-progress`.
      content:
        application/json:
          schema:
            type: object
            required: [error, code, params]
            properties:
              error: { type: string }
              code:
                type: string
                enum: [idempotency-key-in-progress]
              params: { type: object, nullable: true }
    '422':
      description: |
        **(ADDED IN v1.38)** The Idempotency-Key was previously used for a
        different request. The response code is `idempotency-key-mismatch`.
      content:
        application/json:
          schema:
            type: object
            required: [error, code, params]
            properties:
              error: { type: string }
              code:
                type: string
                enum: [idempotency-key-mismatch]
              params: { type: object, nullable: true }
    '404':
      description: Shipment not found
