post:
  operationId: createTrackingUrlDeliveryIndex
  tags: [Shipments]
  summary: Parcel tracking URL
  description: |
    Creates a tracking URL for a specific parcel by index
  x-codeSamples:
    - $ref: ../../code_samples/Shell/shipments/create-tracking-url-deliveryIndex.yaml

  ##############################################################################

  parameters:
    - in: path
      name: shipmentId
      required: true
      schema:
        type: string
      description: The ID of the shipment
    - in: path
      name: deliveryIndex
      required: true
      schema:
        type: number
      description: The index of the parcel to retrieve a tracking URL for
    - $ref: ../../components/headers/idempotency-key.yaml
  requestBody:
    description: 'Optional request parameters'
    content:
      application/json:
        schema:
          type: object
          properties:
            lifetime:
              description: 'Lifetime of the tracking URL in seconds. Default is 24 hours and maximum is 31 days. After the lifetime the tracking page will respond with 404.'
              type: integer
              minimum: 1
              maximum: 2678400
              default: 86400
        examples:
          lifetime:
            summary: 'lifetime of 7 days'
            value: { lifetime: 604800 }
  responses:
    '200':
      description: Success
      headers:
        Idempotency-Replayed:
          description: |
            **(ADDED IN v1.38)** Present with a value of `true` when this is a
            replay of a completed request.
          schema:
            type: boolean
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/responses/TrackingUrlResponse.yaml
          examples:
            Valid Tracking Url:
              value:
                data:
                  trackingUrl: "{tracking-server-url}?token=<jwt token goes here>"
    '400':
      description: |
        Bad Request.

        **(ADDED IN v1.38)** A malformed Idempotency-Key returns
        `code: idempotency-key-invalid`.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, nullable: true }
              code:
                type: string
                nullable: true
                description: |
                  `idempotency-key-invalid` indicates the Idempotency-Key is
                  empty, longer than 255 characters, or contains non-printable
                  characters.
              params: { type: object, nullable: true }
    '409':
      description: |
        **(ADDED IN v1.38)** A request with the same Idempotency-Key is still
        being processed. Retry after a short backoff. The response code is
        `idempotency-key-in-progress`.
      content:
        application/json:
          schema:
            type: object
            required: [error, code, params]
            properties:
              error: { type: string }
              code:
                type: string
                enum: [idempotency-key-in-progress]
              params: { type: object, nullable: true }
    '422':
      description: |
        **(ADDED IN v1.38)** The Idempotency-Key was previously used for a
        different request. The response code is `idempotency-key-mismatch`.
      content:
        application/json:
          schema:
            type: object
            required: [error, code, params]
            properties:
              error: { type: string }
              code:
                type: string
                enum: [idempotency-key-mismatch]
              params: { type: object, nullable: true }
    '500':
      description: Unknown server problem
