  - name: Webhooks
    description: |
      Retrieve and manage webhooks for a Trexity Merchant.

      ## Delivery format

      Trexity sends full payloads containing complete entity data, not thin
      payloads. Every webhook request body has exactly this envelope:

      ```json
      {
        "data": {
          "...": "complete entity data"
        },
        "timestamp": "2026-07-21T18:42:10.123Z",
        "type": "shipment.created"
      }
      ```

      - `type` is the event name and has the same value as the deprecated
        `x-trexity-event-name` header.
      - `timestamp` is the ISO-8601 time the event occurred, with millisecond
        resolution. It is stable across retries and should be used for event
        ordering. Two events in the same millisecond have the same timestamp
        and are unordered relative to each other.

      ## Delivery headers

      Every webhook delivery follows the
      [Standard Webhooks specification](https://github.com/standard-webhooks/standard-webhooks)
      and includes:

      - `webhook-id`: a UUID v4 that is stable across all retry attempts for the
        same delivery. Use it as the idempotency key.
      - `webhook-timestamp`: the Unix timestamp in seconds for that delivery
        attempt. It changes on each retry.
      - `webhook-signature`: one or more space-delimited signatures in
        `v1,<base64>` format. Parsers must handle multiple signatures.

      The signature is HMAC-SHA256 over
      `${webhook-id}.${webhook-timestamp}.${raw request body}`, keyed with the
      raw secret bytes.

      The deprecated `x-trexity-signature`, `x-trexity-event-name`, and
      `x-trexity-webhook-order-id` headers continue to be sent for backwards
      compatibility. No removal date has been announced.

      ## Retries and idempotency

      Webhook delivery is at-least-once, so receivers can see duplicate
      deliveries.

      A delivery succeeds only when your endpoint returns a `2xx` status within
      60 seconds. Any other outcome is retried:

      - a non-2xx response, such as `429`, `500`, `502`, or `503`
      - a request that never completes: a connection or DNS failure, a TLS
        error, or no response within 60 seconds

      Both are treated the same way, because the sender cannot distinguish an
      endpoint that is down from one that is merely failing. Retries run up to
      10 attempts, each scheduled 2-5 minutes after the previous failure
      (randomized, not escalating).

      Returning a non-2xx status is therefore the supported way to ask for a
      redelivery when your service cannot process an event.

      Deduplicate on `webhook-id`, which is identical across attempts. The raw
      payload bytes are also identical; only `webhook-timestamp` and
      `webhook-signature` change for each retry attempt. Custom headers are
      re-read at each attempt, so header edits take effect on subsequent
      retries.

      ## Custom headers

      A webhook may have up to 10 custom headers. Create-time headers are
      optional, and configured headers are otherwise managed through
      `/webhooks/{webhookId}/headers`. The list-webhooks response does not
      include custom header data.

      `Authorization` is sensitive: its value is encrypted at rest and is never
      returned when headers are read. Sensitive headers are omitted from
      `headers` and appear only by name in the `sensitive` list, so the two sets
      are mutually exclusive. Sensitive and reserved-name checks are
      case-insensitive.

      ## Parcel Events

      A Shipment is a container of parcels, each with their own delivery address.
      However, the Shipment has a single pickup address. As activity occurs on a
      parcel the Shipment's `currentStatus` oscilates between `OUT_FOR_DELIVERY`,
      `ARRIVED_AT_DELIVERY` and `DELIVERED`. However, the Shipment alone doesn't
      inform you of what parcel the status is for.

      To listen to parcel events listen to the following webhooks:
      - `parcel.created` The parcel has been created during shipment creation or update
      - `parcel.updated` The parcel has been updated during shipment update
      - `parcel.deleted` The parcel has been deleted during shipment udpate
      - `parcel.picked_up` The driver has scanned and picked up a parcel
      - `parcel.delivered` The driver has scanned and delivered a parcel
      - `parcel.returning` The driver is returning a parcel
      - `parcel.returned` The driver has returned a parcel to pickup address

      The request payload of these webhook events indicate the parcel that is currently
      being affected.

      ## Storing The shipmentId

      If you have the need to update pickup-related information such as the pickup address, POD settings,
      or the pickup instructions, or you are polling the shipment endpoints for the status of the shipment
      then you will need to store and reference the `shipmentId`. However, the `shipmentId` can change for
      a parcel if the parcel is moved, cloned or bundled. You can re-map your orders/parcels by listening to
      the `shipment.created` webhook.

      > You will need to ensure that you provide a value for a parcel's `externalId` field when you crate a shipment.
      > This field is intended to be an identifier that references back to your system.

      ```js
      // This sample code uses Nodejs with Express
      function trexity_shipmentCreated (req, res, next) {
        const shipmentId = req.body.data.id
        const parcels = body.parcels
        const promises = []

        for (const parcel of parcels) {
          const orderId = parcel.externalId

          // Generally this is where you would update the Trexity shipment ID associated to your order.
          //
          // For example update the metadata associated to your order where the orders_metadata table
          // has at least the following columns: order_id, key, and value, and there is a unique constraint
          // on the order_id:key column pair. The end result is that the metadata field will be upserted.
          const promise = executeParameterizedSql(`
            INSERT INTO orders_metadata (order_id, key, value)
            VALUES ($1, 'trexity_shipment_id', $2)
            ON CONFLICT
            DO UPDATE set value = EXCLUDED.value
          `, [orderId, shipmentId])

          promises.push(promise)
        }

        Promise.allSettled(promises)
          .then(() => res.status(200).json({}))
      }
      ```

      ## Verifying Webhook Requests

      Fetch the signing secrets from `GET /webhooks/secret-key`, then pass
      `standardWebhooksSecretKey` to a
      [Standard Webhooks library](https://github.com/standard-webhooks/standard-webhooks/tree/main/libraries).
      This value has the format `whsec_<base64>`.

      > **WARNING:** Never pass the legacy `secretKey` to a Standard Webhooks
      > library. `secretKey` is itself valid base64, so the library silently
      > derives a different key and every verification fails with no obvious
      > configuration error. Always use `standardWebhooksSecretKey`.

      Verify the signature over the raw request body bytes before parsing JSON.
      Re-serializing a parsed body changes its bytes and breaks verification.
      For example, the official JavaScript library can be used with Express as
      follows:

      ```js
      import express from 'express'
      import { Webhook } from 'standardwebhooks'

      const app = express()
      const verifier = new Webhook(
        process.env.TREXITY_STANDARD_WEBHOOK_SECRET
      )

      app.post(
        '/trexity/webhooks',
        express.raw({ type: 'application/json' }),
        async (req, res) => {
          let event

          try {
            event = verifier.verify(req.body, {
              'webhook-id': req.get('webhook-id'),
              'webhook-timestamp': req.get('webhook-timestamp'),
              'webhook-signature': req.get('webhook-signature')
            })
          } catch {
            return res.sendStatus(403)
          }

          const deliveryId = req.get('webhook-id')
          // Atomically skip deliveryId if it has already been processed.
          await processTrexityEvent(event, deliveryId)
          return res.sendStatus(204)
        }
      )
      ```

      Standard Webhooks libraries handle space-delimited signature lists and
      enforce a timestamp-tolerance window. The official JavaScript library
      rejects timestamps more than five minutes in the past or future. Keep
      receiver clocks synchronized and do not disable this protection.

      ### Legacy verification appendix

      New integrations should use Standard Webhooks. For existing integrations,
      `x-trexity-signature` is a hex HMAC-SHA256 over the raw request body using
      the legacy `secretKey`. It can be verified as follows:

      ```js
      import { createHmac, timingSafeEqual } from 'node:crypto'

      const expected = createHmac(
        'sha256',
        process.env.TREXITY_LEGACY_WEBHOOK_SECRET
      ).update(req.body).digest()

      const supplied = Buffer.from(
        req.get('x-trexity-signature') ?? '',
        'hex'
      )

      const isValid =
        supplied.length === expected.length &&
        timingSafeEqual(supplied, expected)
      ```

      The legacy header continues to be sent for backwards compatibility, but
      no removal date has been announced.

